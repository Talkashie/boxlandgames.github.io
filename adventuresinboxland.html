<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<title>Adventures in Box Land!</title>
<link rel="stylesheet" href="css/styles.css">

</head>

<body>
<main>

<!-- Main header section -->
<section class="headerbox">
<h1>Adventures in Box Land!</h1>
</section>

<!-- List of features -->
<section class="gamebox">
<h2>Customize!</h2>
<h4>Create your very own Boxlandian!</h4>
<div class="align_center">
<img class="expandable-image tilt-image" src="images/customize.jpg">
</div>
</section>

<section class="gamebox">
<h2>Go fishing!</h2>
<h4>There are over a hundred different fish and items you can catch at multiple fishing locations!</h4>
<div class="align_center">
<img class="expandable-image tilt-image" src="images/fishing.jpg">
</div>
</section>

<section class="gamebox">
<h2>Battle!</h2>
<h4>Fight against otherworldly foe to save Box Land!</h4>
<div class="align_center">
<img class="expandable-image tilt-image" src="images/battle.jpg">
</div>
</section>

<section class="gamebox">
<h2>Gallery</h2>
<h4>Sights from across Box Land...</h4>
<div class="gallery">
<img class="expandable-image tilt-image" src="images/gallery1.jpg">
<img class="expandable-image tilt-image" src="images/gallery2.jpg">
<img class="expandable-image tilt-image" src="images/gallery3.jpg">
<img class="expandable-image tilt-image" src="images/gallery4.jpg">
<img class="expandable-image tilt-image" src="images/gallery5.jpg">
<img class="expandable-image tilt-image" src="images/gallery6.jpg">
</div>
</section>

<div class="align_center bottom-link">
<a class="biglink" href="index.html">Back</a>

</main>


<!-- Image popup for click-to-expand images -->
<div id="imagePopup" class="image-popup" onclick="closeImage()">
<span class="close-popup">&times;</span>
<img id="popupImage" src="" alt="Expanded image">
</div>

<script src="js/image-popup.js"></script>
</body>

</html>
